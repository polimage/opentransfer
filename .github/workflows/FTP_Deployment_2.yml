name: FTP Deployment_2

on:
  push:
    branches:
      - gh_pages  # <--- Ändere dies ggf. auf deine Ziel-Branch

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repository auschecken
      uses: actions/checkout@v3

    - name: 🔐 FTP Upload mit FTP-Deploy-Action
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        local-dir: ./  # <--- ggf. Pfad anpassen (z. B. ./dist/ oder ./public/)
        server-dir: /  # Zielverzeichnis auf dem FTP-Server
